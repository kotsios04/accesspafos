name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npm --prefix functions ci

      - name: Parse every Cloud Function module
        run: npm --prefix functions run build

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholders: the build must succeed without real credentials, and
          # these values never reach a deployed artefact.
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci
          VITE_FIREBASE_STORAGE_BUCKET: ci.appspot.com
          VITE_FIREBASE_APP_ID: 1:0:web:0

      # The Firestore emulator is a Java process, and firebase-tools 15
      # requires a JDK 21 or newer. The runner's default JDK is older, so the
      # emulator refuses to start without this.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Runs `firebase emulators:exec` through the firebase-tools pinned in
      # devDependencies rather than a global `npm install -g firebase-tools`:
      # CI then uses the same version as local development, and a new major
      # release cannot break the build on its own. The script also carries the
      # project id the rules tests connect with - firebase.json enables
      # emulators.singleProjectMode, so the two have to agree.
      - name: Security rules tests
        run: npm run test:rules:emulator
